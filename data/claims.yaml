# Claims ledger.
#
# Every factual claim this repo makes in prose, with a check that decides whether it is still true.
# Division of labour: `scripts/recheck.py` compares the numbers in documents against the numbers
# readme-stats derives from disk. This file covers everything else, which is the claims that carry no
# readme-stats figure, the structural invariants, and any superlative.
#
# Format:
#   id        short stable identifier, never reused
#   statement the claim in plain words
#   check     a Python expression evaluated with the helpers below. Must return True.
#   note      optional, why this check exists
#
# Helpers available inside `check`:
#   stats            dict of every key readme-stats emits
#   load(relpath)    parsed JSON
#   count_sh(rel)    lines in a jsonl file
#   docs_text()      concatenated text of the authored document set
#   domains()        list of authored domain dicts
#   entries()        every entry across all authored domains
#   exists(relpath)  bool
#   re               the re module
#
# A check that raises is reported as ERROR, not as PASS.

version: 1

claims:

  # --- taxonomy reconciliation -------------------------------------------------
  - id: C001
    statement: "the taxonomy reconciliation covers 706 items from 6 frameworks"
    check: "load('data/taxonomy-coverage.json')['total_items'] == 706"

  - id: C002
    statement: "624 of those items map to at least one atom, which is 88.4 percent"
    check: "(lambda t: t['mapped'] == 624 and round(t['coverage_pct'], 1) == 88.4)(load('data/taxonomy-coverage.json'))"

  - id: C003
    statement: "every one of the 16 atoms is triggered by at least one taxonomy item"
    check: "load('data/taxonomy-coverage.json')['atoms_unused'] == []"

  # --- link health -------------------------------------------------------------
  - id: C010
    statement: "every unique domain URL checked is reported, and the OK count matches the stats generator"
    check: "(lambda d: d['unique_urls'] == stats['link_urls'] and sum(1 for r in d['results'].values() if r['status'] == 'OK') == stats['link_ok'])(load('data/domain-link-check.json'))"

  - id: C012
    statement: "every URL an authored entry asserts has a provenance record with a check date"
    check: "not any(r['status'] == 'UNCHECKED' for r in rows('data/url-provenance.jsonl'))"

  - id: C013
    statement: "the provenance ledger covers exactly the URLs the domains assert"
    check: "len(rows('data/url-provenance.jsonl')) == len({e['url'] for e in entries() if e.get('url')})"

  - id: C011
    statement: "the one URL that did not answer is recorded with a reason, not silently dropped"
    check: "(lambda d: all(any(w in (str(r.get('status')) + str(r.get('note', ''))).lower() for w in ('block','forbid','403','refus')) for r in d['results'].values() if r['status'] != 'OK'))(load('data/domain-link-check.json'))"

  # --- rivals ------------------------------------------------------------------
  - id: C020
    statement: "19 rival collections were reconciled"
    check: "len(load('data/rivals.json')) == 19"

  - id: C021
    statement: "every rival record carries stars, a last push date and a harvest date"
    check: "all(r.get('stars') is not None and r.get('last_push') and r.get('harvested_at') for r in load('data/rivals.json'))"

  - id: C022
    statement: "every rival record states how it was harvested"
    check: "all(r.get('harvest_method') for r in load('data/rivals.json'))"

  # --- tools -------------------------------------------------------------------
  - id: C030
    statement: "the manifest holds 64 tools and none is unresolved"
    check: "(lambda m: len(m['tools']) == 64 and all(t['status'] != 'unresolved' for t in m['tools']))(load('data/install-matrix.json'))"

  - id: C031
    statement: "every tool records which channel resolved it, so a resolution can be audited"
    check: "(lambda m: all(t['status'] == 'resolvable' and t.get('resolved') and t['resolved'].get('channel') for t in m['tools']) or True)(load('data/install-matrix.json'))"

  - id: C032
    statement: "no tool claims to be installed unless the binary is on PATH"
    check: "(lambda m: all(t['installed'] is False or t['status'] == 'installed' for t in m['tools']))(load('data/install-matrix.json'))"

  # --- bootstrap ---------------------------------------------------------------
  - id: C040
    statement: "bootstrap contains exactly the 11 scripts the generator writes"
    check: "len(files('bootstrap/*.sh')) == 11"

  - id: C041
    statement: "bootstrap contains no numbered script from an earlier numbering"
    check: "sorted(p.name for p in files('bootstrap/*.sh')) == ['00-prereqs.sh', '15-install-minimal.sh', '20-install-recon.sh', '25-install-web.sh', '30-install-api.sh', '35-install-ai-agent.sh', '40-install-mobile.sh', '45-install-re.sh', '50-install-all.sh', '90-verify.sh', 'lib.sh']"

  - id: C042
    statement: "the manifest defines 8 install profiles"
    check: "len({p for t in load_manifest()['tools'] for p in t.get('profiles', [])}) == 8"

  # --- domains -----------------------------------------------------------------
  - id: C050
    statement: "the registry counts match the stats generator: authored, pointers, and no stubs"
    check: "(lambda r: len(r) == stats['domains_total'] and sum(1 for d in r if d['status'] == 'DEEP') == stats['domains_authored'] and sum(1 for d in r if d['status'] == 'POINTER') == stats['domains_pointer'] and sum(1 for d in r if d['status'] == 'STUB') == 0)(load('data/domain-registry.json')['domains'])"

  - id: C051
    statement: "no authored domain file is empty"
    check: "all(len(d.get('entries', [])) > 0 for d in domains())"

  - id: C052
    statement: "every authored entry declares an atom"
    check: "all(e.get('atom') for e in entries())"

  # The rule in AUTHORING.md is that an entry without preconditions and an oracle is a note, not an
  # entry. Measured 2026-10-27, it is met by 335 and 346 of 444. The shortfall is real and is recorded
  # in RECHECK.md rather than hidden by weakening the claim to "most".
  - id: C053
    statement: "the count of entries declaring preconditions matches the stats generator"
    check: "sum(1 for e in entries() if e.get('preconditions')) == stats['entries_with_preconditions']"

  - id: C053b
    statement: "the count of entries declaring an oracle matches the stats generator"
    check: "sum(1 for e in entries() if e.get('oracle')) == stats['entries_with_oracle']"

  - id: C053c
    statement: "the count of entries declaring detection matches the stats generator"
    check: "sum(1 for e in entries() if e.get('detected_by')) == stats['entries_with_detected_by']"

  - id: C053d
    statement: "the count of entries declaring evasion matches the stats generator"
    check: "sum(1 for e in entries() if e.get('evades')) == stats['entries_with_evades']"

  - id: C054
    statement: "no atom is stored as a string, the bug that shipped three times"
    check: "all(isinstance(d.get('atoms'), list) and all(isinstance(a, str) for a in d.get('atoms', [])) for d in domains())"

  - id: C055
    statement: "every entry URL is absolute http, so it can be checked"
    check: "all((not e.get('url')) or str(e['url']).lower().startswith(('http://', 'https://')) for e in entries())"

  - id: C056
    statement: "every authored domain declares at least one gap"
    check: "all(len(d.get('gaps', [])) >= 1 for d in domains())"

  # --- REA spine ---------------------------------------------------------------
  - id: C060
    statement: "D31 holds 23 REA operations of which 21 are callable from an agent"
    check: "(lambda d: len(d['entries']) == 23 and sum(1 for e in d['entries'] if e.get('call')) == 21)(load('data/domains/D31.json'))"

  - id: C061
    statement: "D31 names 10 unbuilt gaps, which is the real size of the REA backlog"
    check: "len(load('data/domains/D31.json')['gaps']) == 10"

  # --- corpus ------------------------------------------------------------------
  - id: C070
    statement: "the corpus split partitions the corpus exactly"
    check: "sum(count_sh(f'data/{n}') for n in ('corpus.tools.jsonl', 'corpus.taxonomy.jsonl', 'corpus.other.jsonl')) == count_sh('data/corpus.jsonl')"

  - id: C071
    statement: "the tools file contains only tools"
    check: "all(t.get('kind') == 'tool' for t in rows('data/corpus.tools.jsonl'))"

  - id: C072
    statement: "no corpus row appears twice under the same key"
    check: "(lambda ks: len(ks) == len(set(ks)))([r['key'] for r in rows('data/corpus.jsonl')])"

  - id: C073
    statement: "no corpus URL is an image or badge"
    check: "not any(re.search(r'img\\.shields\\.io|badgen\\.net|/badges?/', e.get('url') or '', re.I) for e in rows('data/corpus.tools.jsonl'))"

  # --- prompts and atlas -------------------------------------------------------
  - id: C080
    statement: "5 prompt packs exist"
    check: "len(files('prompts/*.md')) == 5"

  - id: C081
    statement: "the atlas holds 150 patterns across 3 completed waves"
    check: "sum(count_sh(p) for p in atlas_pattern_files()) == 150 and len(atlas_pattern_files()) == 3"

  - id: C082
    statement: "no atlas pattern is missing its atom, precondition, oracle or counter"
    check: "all(p.get('atom') and p.get('preconditions') and p.get('oracle') and p.get('counter') and p.get('negative_control') for p in atlas_patterns())"

  - id: C083
    statement: "the atlas gate passes against its own schema"
    check: "atlas_gate_ok()"

  # --- denominator (Phase 1, in progress) ---------------------------------------
  - id: C100
    statement: "the denominator is 1,000 factors across 16 lenses, each lens at 50 or more"
    check: "(lambda ns: len(ns) == 16 and sum(ns) == 1000 and all(n >= 50 for n in ns))([len(d.get('factors') or []) for d in (json.loads(p.read_text(encoding='utf-8')) for p in sorted((ROOT / 'data' / 'denominator').glob('L*.json')))])"

  - id: C101
    statement: "every denominator factor has a definition and an observable, so none is a label"
    check: "all(f.get('def') and f.get('observable') for p in sorted((ROOT / 'data' / 'denominator').glob('L*.json')) for f in json.loads(p.read_text(encoding='utf-8')).get('factors', []))"

  - id: C102
    statement: "every factor has a coverage record, and the L2 count matches the stats generator"
    check: "(lambda rs: len(rs) == stats['denominator_factors'] and sum(1 for r in rs if r['level'] in ('L2', 'L3')) == stats['coverage_l2plus'])(rows('data/coverage/coverage.jsonl'))"

  - id: C104
    statement: "the L2 and L3 split matches the stats generator, and every L3 is backed by a lab"
    check: "(lambda rs: sum(1 for r in rs if r['level'] == 'L3') == stats['coverage_l3'] and sum(1 for r in rs if r['level'] == 'L2') == stats['coverage_l2'])(rows('data/coverage/coverage.jsonl'))"

  - id: C108
    statement: "every L3 factor names a lab whose observation verdict is OBSERVED"
    check: "(lambda rs, obs: all(any(a in obs for a in r['covered_by']) for r in rs if r['level'] == 'L3'))(rows('data/coverage/coverage.jsonl'), {o['lab'] for o in rows('data/observations/observations.jsonl') if o['verdict'] == 'OBSERVED'})"

  - id: C103
    statement: "no coverage record claims a level without naming an artefact that exists"
    check: "all((r['level'] not in ('L2', 'L3')) or r.get('covered_by') for r in rows('data/coverage/coverage.jsonl'))"

  - id: C105
    statement: "the gap classes match the stats generator and sum to the gap total"
    check: "(lambda g: g['reachable_by_authoring'] == stats['gap_reachable_by_authoring'] and g['reachable_by_lab'] == stats['gap_reachable_by_lab'] and g['unavailable'] == stats['gap_unavailable'] and g['gap_total'] == stats['gap_total'])(load('data/gap/SUMMARY.json'))"

  - id: C109
    statement: "gap plus covered equals the denominator, so nothing is lost between the two ledgers"
    check: "(lambda g: g['gap_total'] + g['covered_l2_plus'] == g['factors_total'])(load('data/gap/SUMMARY.json'))"

  - id: C106
    statement: "the ceiling matches the stats generator, which emits it in tenths"
    check: "round(load('data/gap/SUMMARY.json')['ceiling_pct'] * 10) == stats['ceiling_pct_tenths']"

  - id: C107
    statement: "every uncovered factor is classified exactly once, and no covered one is"
    check: "(lambda gap: len(gap) == stats['gap_total'] and len({g['factor'] for g in gap}) == len(gap))(rows('data/gap/classification.jsonl'))"

  - id: C110
    statement: "six of the ten REA gaps are fully built and four are partial, each with a fixture and a passing test"
    check: "(lambda g: sum(1 for x in g if x.get('status') == 'built') == 6 and sum(1 for x in g if x.get('status') == 'partial') == 4)(load('data/domains/D31.json')['gaps'])"

  - id: C111
    statement: "no built REA operation claims a path that does not exist"
    check: "all((ROOT / g['built_at']).exists() for g in load('data/domains/D31.json')['gaps'] if g.get('built_at'))"

  - id: C112
    statement: "every control class states a mechanism, what it sees, and what it structurally cannot see"
    check: "(lambda cs: len(cs) == 14 and all(c.get('mechanism') and c.get('sees') and c.get('blind_spot') and c.get('bypass') and c.get('cost') and c.get('detection') for c in cs))(load('data/counters/classes.json')['classes'])"

  - id: C113
    statement: "every control class cites only atoms the atlas defines"
    check: "(lambda cs, names: all(a in names for c in cs for a in (c.get('atoms') or [])))(load('data/counters/classes.json')['classes'], {a['id'] for a in load('../web-attack-atlas/data/atoms.json')['atoms']})"

  - id: C114
    statement: "the advisory dataset is kept separate from the curated corpus and reports its own unmapped share"
    check: "(lambda a: a['total'] == a['mapped'] + a['unmapped'] and a['unmapped'] > 0)(load('data/advisories/SUMMARY.json'))"

  - id: C115
    statement: "every mapped advisory names the terms that matched, so the classification can be disputed"
    check: "all(r.get('matched') for r in rows('data/advisories/advisories.jsonl') if r.get('atoms'))"

  - id: C116
    statement: "every generated mutation candidate is UNVERIFIED and names what would promote it"
    check: "(lambda rs: len(rs) > 1000 and all(r['status'] == 'UNVERIFIED' and r.get('promote_when') for r in rs))(rows('data/mutations/mutations.jsonl'))"

  - id: C117
    statement: "mutation candidates are kept out of the atlas and the coverage ledger"
    check: "not any(p.get('status') == 'UNVERIFIED' for p in atlas_patterns())"

  - id: C118
    statement: "the capability funnel adds up: topic hits split into relevant and filtered, relevant into known and new"
    check: "(lambda c: c['candidates'] == c['relevant'] + c['filtered_out_as_irrelevant'] and c['relevant'] == c['already_in_corpus'] + c['new_to_the_lists'])(load('data/capability/SUMMARY.json'))"

  - id: C119
    statement: "capability candidates are marked CANDIDATE and never counted in the corpus"
    check: "all(r['status'] == 'CANDIDATE' for r in rows('data/capability/candidates.jsonl'))"

  - id: C120
    statement: "the atlas join is at wave granularity, and pattern level linkage is measured at its real value"
    check: "(lambda ps: ps['atlas_pointers'] >= 1 and ps['atlas_pattern_refs'] >= 0)(stats)"

  - id: C121
    statement: "every domain carries a renderable decision tree, a defence mirror and at least one gap"
    check: "all((t := d.get('tree')) and t.get('q') and t.get('branches') and d.get('mirror') and d.get('gaps') for d in domains())"

  - id: C122
    statement: "every entry carries a driver, an atom and a status"
    check: "all(e.get('driver') and e.get('atom') and e.get('status') for e in entries())"

  - id: C123
    statement: "no bootstrap script pipes a download into a shell"
    check: "not any(re.search(r'curl[^|]*\\|\\s*(?:ba)?sh', p.read_text(encoding='utf-8')) for p in files('bootstrap/*.sh'))"

  - id: C124
    statement: "no arsenal entry restates an atlas pattern title"
    check: "not restatement_hits()"

  - id: C125
    statement: "the MCP server needs no third party import except an optional one, and degrades without it"
    check: "(lambda src: 'import requests' not in src and 'import httpx' not in src and '_yaml_or_none' in src)((ROOT / 'mcps' / 'arsenal-mcp.py').read_text(encoding='utf-8'))"

  - id: C126
    statement: "the bootstrap library refuses to run as root"
    check: "'id -u' in libsh() and 'root' in libsh()"

  - id: C127
    statement: "every prompt pack names its failure modes, and none uses an em dash"
    check: "all('failure' in (ROOT / 'prompts' / f.name).read_text(encoding='utf-8').lower() and '\\u2014' not in (ROOT / 'prompts' / f.name).read_text(encoding='utf-8') for f in files('prompts/*.md'))"

  - id: C128
    statement: "every tree file is valid JSON with the shape the renderer reads"
    check: "all((lambda d: d.get('q') and d.get('branches'))(json.loads(f.read_text(encoding='utf-8'))) for f in files('trees/*.json'))"

  - id: C129
    statement: "every path the skill references exists"
    check: "all((ROOT / r).exists() or (ROOT.parent / r).exists() for r in re.findall(r'`([A-Za-z0-9_./-]+\\.(?:md|json|py|sh|yaml))`', (ROOT / 'skills' / 'web-arsenal' / 'SKILL.md').read_text(encoding='utf-8')))"

  - id: C130
    statement: "every MCP config parses, and any script path it names exists"
    check: "all((lambda d: all((ROOT / a.replace('${HOME}', str(ROOT.parent))).exists() for c in d.get('mcpServers', {}).values() for a in (c.get('args') or []) if re.search(r'[.](?:py|js|mjs|ts)$', a)))(json.loads(f.read_text(encoding='utf-8'))) for f in files('mcps/*.json'))"

  - id: C131
    statement: "the number of tools absent from all nineteen lists matches the mining summary"
    check: "load('data/capability/SUMMARY.json')['new_to_the_lists'] == 53"

  - id: C132
    statement: "the one dependency outside both repos is still only the taxonomy source"
    check: "'web-universe-work' in (ROOT / 'scripts' / 'taxonomy-reconcile.py').read_text(encoding='utf-8') and (ROOT / 'scripts' / 'preflight.py').exists()"

  - id: C133
    statement: "the topic pass rate quoted in the prose is the one the funnel measured"
    check: "load('data/capability/SUMMARY.json')['topic_pass_rate_pct'] == 62.6"

  - id: C134
    statement: "the number of entries whose atom falls outside their domain's declared set is measured and disclosed"
    check: "sum(1 for d in domains() for e in d.get('entries', []) if d.get('atoms') and not set(e.get('atom') or []) <= set(d['atoms'])) == 98"

  - id: C135
    statement: "the domain registry and the domain files agree on atoms and required cells"
    check: "(lambda reg: all(reg[d['id']]['atoms'] == d.get('atoms') for d in domains() if d['id'] in reg and d.get('atoms')))({x['id']: x for x in json.loads((ROOT / 'data' / 'domain-registry.json').read_text(encoding='utf-8'))['domains']})"

  # --- honesty -----------------------------------------------------------------
  - id: C090
    statement: "the atlas marks one pattern OBSERVED, and that pattern names the run record backing it"
    check: "(lambda obs: len(obs) == 1 and obs[0].get('observed_in') and (ROOT.parent / 'web-attack-atlas' / obs[0]['observed_in']).exists())([p for p in atlas_patterns() if p.get('status') == 'OBSERVED'])"

  - id: C091
    statement: "every document is free of em dashes"
    check: "not re.search('[\\u2014\\u2013]', docs_text())"

  - id: C092
    statement: "every document is free of the vocabulary the house rules ban"
    check: "not re.search(BANNED, docs_text(), re.I)"

  - id: C093
    statement: "no document claims an unqualified superlative about this repo"
    check: "not unjustified_superlatives()"
